<!-- Setting doc type -->
<!DOCTYPE html>

<!-- adding html doc, and language -->
<html lang="en">

<head>
	<!-- web page title -->
	<title>Snazzy Paws Grooming - Home</title>

	<!-- adding charset to ensure all characters can be used without breaking -->
	<meta charset="utf-8">

	<!-- ensuring browser displays according to the device screen width, and zoom level is at 100% -->
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<!-- adding page description to improve accessibility -->
	<meta name="description"
		content="Snazzy Paws Grooming provides professional dog grooming services in Hamilton CBD. Quality care, experienced groomers and easy online booking for your pet.">

	<!-- pre-loading google fonts - helps improve performance-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<!-- adding bootstrap stylesheet-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- adding css style sheet -->
	<link rel="stylesheet" href="css/a3css.css">

	<!-- adding custom fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600;700&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>

<body>
	<main>
		<section>
			<div class="container py-5">

			</div>
		</section>


		<section class="contact-page py-5">


			<div class="col-12 col-lg-6 d-flex font--dm">
			<div class="px-4 pt-4 w-100">
				
				<form class="p-5">
					<h2 class="fs-2 fw-bold">Send us a message...</h2>
					<div class="mb-3">
						<label class="mb-1 ps-1" for="fullname">Name:</label>
						<input id="fullname" class="form-control" type="text" name="fullname"
							placeholder="Name...">
					</div>
					<div class="mb-3">
						<label class="mb-1 ps-1" for="email">Email address:</label>
						<input id="email" class="form-control" type="email" name="email"
							placeholder="Email...">
					</div>
					<div class="mb-3">
						<label class="mb-1 ps-1" for="phone">Contact phone number:</label>
						<input id="phone" class="form-control" type="tel" name="phone"
							placeholder="Phone number...">
					</div>

					<div class="mb-3">
						<label class="mb-1 ps-1" for="petname">Pet’s name:</label>
						<input id="petname" class="form-control" type="text" name="petname"
							placeholder="Pet’s name...">
					</div>

					<div class="mb-3">
						<label class="mb-1 ps-1" for="message">Message: </label>
						<textarea id="message" rows="10" class="form-control" name="message"
							placeholder="Your message..."></textarea>
					</div>

					<div class="mt-4">
						<button type="submit" value="Submit"
							class="btn btn--wide shadow d-flex justify-content-center mx-auto mb-0">Submit</button>
					</div>
				</form>
			</div>
		</div>

		</section>

		<section>
			<div class="container py-5">

			</div>



		</section>

		<section class="index-mobile-contact">

			<div class="container py-5">

                <div class="col-12">
                    <div class="card border-0">
                        <div class="card-body d-flex align-items-center justify-content-center w-100">
                            <div class="d-flex gap-4 flex-column font--dm min-w-0">

								<div class="d-flex justify-content-start align-items-center gap-4 min-w-0">
                                    <img src="images/icons/logo-green.svg" alt="" aria-hidden="true" width="44"
                                            height="44" loading="lazy">
                                    <div class="card-text">

                                        <span class="mb-1 d-block">Opening hours</span>
                                        <span class="mb-0 d-block fw-bold">Monday - Saturday</span>
										<span class="mb-0 fw-bold">9:00am - 5:00pm</span>
                                    </div>

                                </div>


                                <div class="d-flex justify-content-start align-items-center gap-4 min-w-0">
                                    <img src="images/icons/phone.svg" alt="" aria-hidden="true" width="44" height="44"
                                        loading="lazy">
                                    <div class="card-text">

                                        <span class="mb-1 d-block">Call us</span>
                                        <span class="mb-0 fw-bold">(000) 123 123345</span>
                                    </div>

                                </div>

                                <div class="d-flex justify-content-start align-items-center gap-4 min-w-0">
                                    <img src="images/icons/email.svg" alt="" aria-hidden="true" width="44" height="44"
                                        loading="lazy">
                                    <div class="card-text">

                                        <span class="mb-1 d-block">Email us</span>
                                        <span
                                            class="mb-0 fw-bold external-link--green text-break">hello@snazzypawsgrooming.co.nz</span>

                                    </div>
                                </div>

                                <div class="d-flex justify-content-start align-items-center gap-4 in-w-0">
                                    <img src="images/icons/location.svg" alt="" aria-hidden="true" width="44"
                                        height="44" loading="lazy">
                                    <div class="card-text">

                                        <span class="mb-1 d-block">Visit us</span>
                                        <span class="mb-0 d-block fw-bold">Shop 3 - 501 Center Place</span>
                                        <span class="mb-0 d-block fw-bold">Central CBD District</span>
                                        <span class="mb-0 fw-bold">Hamilton 2879</span>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

			

		</section>
	</main>
</body>

</html>
