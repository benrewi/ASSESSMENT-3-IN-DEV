<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. Desktop: Default table behavior (4 columns) */
        .custom-responsive-table thead, 
        .custom-responsive-table tbody, 
        .custom-responsive-table tr {
            display: table-row-group; /* Reset for standard view */
        }

        /* 2. Tablet (2x2 Grid): Breakpoint at 992px */
        @media (max-width: 992px) {
            .custom-responsive-table thead,
            .custom-responsive-table tbody,
            .custom-responsive-table tr {
                display: flex;
                flex-wrap: wrap;
                width: 100%;
            }

            /* Forces each cell to take 50% width, creating a 2x2 grid */
            .custom-responsive-table th, 
            .custom-responsive-table td {
                flex: 0 0 50%; 
                border: 1px solid #dee2e6;
            }

            /* Ensures the header row and data rows align visually as a 2x2 */
            .custom-responsive-table thead {
                border-bottom: 2px solid #333;
            }
        }

        /* 3. Mobile (List View): Breakpoint at 576px */
        @media (max-width: 576px) {
            .custom-responsive-table th, 
            .custom-responsive-table td {
                flex: 0 0 100%; /* Full width for list layout */
            }

            /* OPTIONAL: To make the list view clearer, you can hide the main 
               header row and use 'data-labels' to keep headings with contents. */
            .custom-responsive-table thead {
                display: none;
            }
            .custom-responsive-table td::before {
                content: attr(data-label); /* Pulls header name from HTML */
                font-weight: bold;
                display: block;
                color: #6c757d;
                font-size: 0.75rem;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body class="p-4 bg-light">

<div class="container">
    <table class="table table-bordered bg-white custom-responsive-table">
        <thead class="table-dark">
            <tr>
                <th>Header 1</th>
                <th>Header 2</th>
                <th>Header 3</th>
                <th>Header 4</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-label="Header 1">Data 1-A</td>
                <td data-label="Header 2">Data 1-B</td>
                <td data-label="Header 3">Data 1-C</td>
                <td data-label="Header 4">Data 1-D</td>
            </tr>
            <tr>
                <td data-label="Header 1">Data 2-A</td>
                <td data-label="Header 2">Data 2-B</td>
                <td data-label="Header 3">Data 2-C</td>
                <td data-label="Header 4">Data 2-D</td>
            </tr>
            <tr>
                <td data-label="Header 1">Data 3-A</td>
                <td data-label="Header 2">Data 3-B</td>
                <td data-label="Header 3">Data 3-C</td>
                <td data-label="Header 4">Data 3-D</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
